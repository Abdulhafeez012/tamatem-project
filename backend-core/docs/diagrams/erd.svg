<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 8 1096 893.75" width="1096" height="894" role="img" aria-label="Three tables: auth_user, products_product and orders_order, with orders_order holding protected foreign keys to both.">
<title>Three tables: auth_user, products_product and orders_order, with orders_order holding protected foreign keys to both.</title>
