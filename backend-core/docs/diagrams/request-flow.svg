<path d="M 665 682 L 665 760" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 665 822 L 665 900" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 665 962 L 665 1040" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#ah)"/>
<text x="60" y="1513" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">The domain apps hold models only; every serializer, view, route, filter and paginator lives under</text>
<text x="60" y="1529.25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">api/v1/&lt;domain&gt;/. Adding /api/v2/ means a new package beside v1 — no model change.</text>
<text x="500" y="1199" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">The lock plus the atomic block make two</text>
<text x="500" y="1215.25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">simultaneous purchases of the same product</text>
<text x="500" y="1231.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">serialise. The Idempotency-Key makes a</text>
<text x="500" y="1247.75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">retry safe: a repeat returns the original</text>
<text x="500" y="1264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">order rather than placing a second one,</text>
<text x="500" y="1280.25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">enforced by a unique constraint so even a</text>
<text x="500" y="1296.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">concurrent retry cannot slip through.</text>
</svg>
