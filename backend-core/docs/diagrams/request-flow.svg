<text x="665" y="646.875" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#1e1e1e">transaction.atomic()</text>
<text x="665" y="670.875" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">api/v1/orders/views.py</text>
<rect x="500" y="760" width="330" height="62" rx="8" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/>
<text x="665" y="786.875" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#1e1e1e">select_for_update()</text>
