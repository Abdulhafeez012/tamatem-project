<text x="40" y="593" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">The frontend owns no database — this is its type and storage model. Prices stay strings all the way to the screen because that is how DRF</text>
<text x="40" y="609.25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">serialises DecimalField, and parsing them into floats would introduce rounding the server never had. The API exposes no currency field, so</text>
<text x="40" y="625.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">amounts render as plain numbers.</text>
<text x="60" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">Written on sign-in, cleared on</text>
<text x="60" y="329.25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">sign-out or a failed refresh. The</text>
<text x="60" y="345.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">storage event propagates a sign-out</text>
<text x="60" y="361.75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5f66">to other tabs.</text>
</svg>
